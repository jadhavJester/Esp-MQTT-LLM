<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Control Console - MCP over MQTT</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #070913;
            --panel-bg: rgba(13, 17, 28, 0.7);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-blue: #00d2ff;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --text-main: #f0f2f5;
            --text-muted: #6e7687;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #12182c 0%, #070913 100%);
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(20px);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .status-dot.connecting {
            background: #ffb700;
            box-shadow: 0 0 10px #ffb700;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-on {
            background: rgba(0, 210, 255, 0.08);
            border-color: rgba(0, 210, 255, 0.3);
            color: var(--accent-blue);
        }

        .btn-on:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.25);
            border-color: var(--accent-blue);
        }

        .btn-off {
            background: rgba(255, 51, 102, 0.08);
            border-color: rgba(255, 51, 102, 0.3);
            color: var(--accent-red);
        }

        .btn-off:hover {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 16px rgba(255, 51, 102, 0.25);
            border-color: var(--accent-red);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .status-label {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .status-val {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-val.active {
            color: var(--accent-blue);
        }

        .status-val.pressed {
            color: var(--accent-green);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .indicator.pressed {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Form controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .console-panel {
            grid-column: span 2;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
        }

        @media (max-width: 768px) {
            .console-panel {
                grid-column: span 1;
            }
        }

        .terminal {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.3);
        }

        .log-entry {
            line-height: 1.5;
            word-break: break-all;
        }

        .log-entry span {
            color: var(--accent-blue);
        }

        .log-entry.success span {
            color: var(--accent-green);
        }

        .log-entry.error span {
            color: var(--accent-red);
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><span>ESP32</span> CONSOLE</h1>
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">DISCONNECTED</span>
            </div>
        </header>

        <main>
            <!-- System Controls -->
            <div class="card">
                <div class="card-title">System Status</div>
                
                <div class="btn-group">
                    <button class="btn btn-on" onclick="sendLedCommand(true)">LED ON</button>
                    <button class="btn btn-off" onclick="sendLedCommand(false)">LED OFF</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="status-row">
                        <span class="status-label">Onboard LED (GPIO 2)</span>
                        <div class="status-val" id="valLed">
                            <span>UNKNOWN</span>
                            <div class="indicator" id="indLed"></div>
                        </div>
                    </div>
                    
                    <div class="status-row">
                        <span class="status-label">BOOT Button (GPIO 0)</span>
                        <div class="status-val" id="valButton">
                            <span>UNKNOWN</span>
                            <div class="indicator" id="indButton"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Generic GPIO Controller -->
            <div class="card">
                <div class="card-title">GPIO Config & Command</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="pinSelect">Pin</label>
                        <select id="pinSelect">
                            <option value="2">GPIO 2 (LED)</option>
                            <option value="0">GPIO 0 (BOOT)</option>
                            <option value="4">GPIO 4</option>
                            <option value="12">GPIO 12</option>
                            <option value="13">GPIO 13</option>
                            <option value="14">GPIO 14</option>
                            <option value="15">GPIO 15</option>
                            <option value="25">GPIO 25</option>
                            <option value="26">GPIO 26</option>
                            <option value="27">GPIO 27</option>
                            <option value="32">GPIO 32</option>
                            <option value="33">GPIO 33</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="modeSelect">Mode</label>
                        <select id="modeSelect">
                            <option value="output">Output</option>
                            <option value="input">Input</option>
                            <option value="input_pullup">Input Pullup</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn" onclick="applyGpioMode()">Set Mode</button>
                    <button class="btn" onclick="readGpioValue()">Read Pin</button>
                </div>

                <div class="form-row" style="align-items: flex-end;">
                    <div class="form-group">
                        <label for="writeVal">Level</label>
                        <select id="writeVal">
                            <option value="1">High (1)</option>
                            <option value="0">Low (0)</option>
                        </select>
                    </div>
                    <button class="btn" style="height: 44px;" onclick="writeGpioValue()">Write Level</button>
                </div>
            </div>

            <!-- Terminal logs -->
            <div class="console-panel">
                <div class="card-title" style="margin-bottom: 16px;">Console Output</div>
                <div id="terminal" class="terminal">
                    <div class="log-entry">Console initialized. Ready.</div>
                </div>
            </div>
        </main>

        <footer>
            MCP OVER MQTT &bull; EMQX &bull; CLIENT ID: <span id="clientIdLabel">---</span>
        </footer>
    </div>

    <script>
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
        const DEVICE_NAME = "esp32_devkit";
        const DEVICE_CLIENT_ID = "esp32_devkit_001";
        
        const CLIENT_ID = "web_console_" + Math.random().toString(16).substring(2, 10);
        document.getElementById("clientIdLabel").textContent = CLIENT_ID;

        const PRESENCE_TOPIC = `$mcp-server/presence/${DEVICE_CLIENT_ID}/${DEVICE_NAME}`;
        const CONTROL_TOPIC = `$mcp-server/${DEVICE_CLIENT_ID}/${DEVICE_NAME}`;
        const RPC_TOPIC = `$mcp-rpc/${CLIENT_ID}/${DEVICE_CLIENT_ID}/${DEVICE_NAME}`;

        let client = null;
        let lastId = 0;
        let pendingCallbacks = {};

        function log(message, type = 'info') {
            const term = document.getElementById("terminal");
            const entry = document.createElement("div");
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `[${timestamp}] <span>[${type.toUpperCase()}]</span> ${message}`;
            term.appendChild(entry);
            term.scrollTop = term.scrollHeight;
        }

        function connectMQTT() {
            const dot = document.getElementById("statusDot");
            const txt = document.getElementById("statusText");

            dot.className = "status-dot connecting";
            txt.textContent = "CONNECTING...";
            log("Connecting to MQTT broker...");

            client = mqtt.connect(MQTT_BROKER, {
                protocolVersion: 5,
                clientId: CLIENT_ID,
                keepalive: 60,
                clean: true
            });

            client.on('connect', () => {
                dot.className = "status-dot connected";
                txt.textContent = "CONNECTED";
                log("Connected to EMQX Broker.", "success");

                client.subscribe(RPC_TOPIC, (err) => {
                    if (err) {
                        log(`Subscription failed: ${err}`, "error");
                    } else {
                        log("Ready to execute commands.");
                        initializeHandshake();
                    }
                });
            });

            client.on('message', (topic, message) => {
                try {
                    const payload = JSON.parse(message.toString());
                    handleRpcResponse(payload);
                } catch (e) {
                    log(`Failed to parse payload: ${message.toString()}`, "error");
                }
            });

            client.on('error', (err) => {
                log(`MQTT Error: ${err}`, "error");
                dot.className = "status-dot";
                txt.textContent = "ERROR";
            });

            client.on('close', () => {
                log("MQTT Connection closed.", "error");
                dot.className = "status-dot";
                txt.textContent = "DISCONNECTED";
            });
        }

        function initializeHandshake() {
            log("Configuring MCP server...");
            const msgId = ++lastId;
            const payload = {
                jsonrpc: "2.0",
                method: "initialize",
                params: {
                    protocolVersion: "2024-11-05",
                    capabilities: {},
                    clientInfo: { name: "web-console", version: "1.0.0" }
                },
                id: msgId
            };

            client.publish(CONTROL_TOPIC, JSON.stringify(payload), {
                properties: {
                    userProperties: { "MCP-MQTT-CLIENT-ID": CLIENT_ID }
                }
            });

            pendingCallbacks[msgId] = (response) => {
                log("MCP configuration completed successfully.", "success");
                sendInitializedNotification();
                setInterval(pollStates, 3000);
                pollStates();
            };
        }

        function sendInitializedNotification() {
            const payload = { jsonrpc: "2.0", method: "notifications/initialized" };
            client.publish(RPC_TOPIC, JSON.stringify(payload));
        }

        function handleRpcResponse(payload) {
            const id = payload.id;
            if (id && pendingCallbacks[id]) {
                const cb = pendingCallbacks[id];
                delete pendingCallbacks[id];
                cb(payload);
            }
        }

        function callTool(toolName, args, callback) {
            const msgId = ++lastId;
            const payload = {
                jsonrpc: "2.0",
                method: "tools/call",
                params: { name: toolName, arguments: args },
                id: msgId
            };
            client.publish(RPC_TOPIC, JSON.stringify(payload));
            pendingCallbacks[msgId] = callback;
        }

        // Onboard controls
        function sendLedCommand(state) {
            const tool = state ? "led_on" : "led_off";
            log(`Calling tool: ${tool}...`);
            callTool(tool, {}, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        updateLedUI(parsed.led === "on");
                        log(`LED state updated to ${parsed.led.toUpperCase()}`, "success");
                    } catch (e) {
                        updateLedUI(state);
                    }
                }
            });
        }

        function updateLedUI(active) {
            const val = document.getElementById("valLed");
            const ind = document.getElementById("indLed");
            if (active) {
                val.querySelector("span").textContent = "ON";
                val.className = "status-val active";
                ind.className = "indicator active";
            } else {
                val.querySelector("span").textContent = "OFF";
                val.className = "status-val";
                ind.className = "indicator";
            }
        }

        function pollStates() {
            callTool("get_led_state", {}, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        updateLedUI(parsed.led === "on");
                    } catch (e) {}
                }
            });

            callTool("read_boot_button", {}, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        const pressed = parsed.pressed;
                        const val = document.getElementById("valButton");
                        const ind = document.getElementById("indButton");
                        if (pressed) {
                            val.querySelector("span").textContent = "PRESSED";
                            val.className = "status-val pressed";
                            ind.className = "indicator pressed";
                        } else {
                            val.querySelector("span").textContent = "RELEASED";
                            val.className = "status-val";
                            ind.className = "indicator";
                        }
                    } catch (e) {}
                }
            });
        }

        // GPIO Config Actions
        function applyGpioMode() {
            const pin = parseInt(document.getElementById("pinSelect").value);
            const mode = document.getElementById("modeSelect").value;
            log(`Configuring Pin ${pin} mode to ${mode}...`);
            callTool("set_gpio_mode", { pin: pin, mode: mode }, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        if (parsed.status === "ok") {
                            log(`Pin ${pin} configured as ${mode.toUpperCase()} successfully.`, "success");
                        } else {
                            log(`Failed to configure Pin ${pin}: ${parsed.error}`, "error");
                        }
                    } catch (e) {
                        log("Error reading response content.", "error");
                    }
                }
            });
        }

        function writeGpioValue() {
            const pin = parseInt(document.getElementById("pinSelect").value);
            const val = parseInt(document.getElementById("writeVal").value);
            log(`Writing level ${val} to Pin ${pin}...`);
            callTool("write_gpio", { pin: pin, level: val }, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        if (parsed.status === "ok") {
                            log(`Pin ${pin} successfully set to ${val}.`, "success");
                        } else {
                            log(`Failed to write to Pin ${pin}: ${parsed.error}`, "error");
                        }
                    } catch (e) {
                        log("Error reading response content.", "error");
                    }
                }
            });
        }

        function readGpioValue() {
            const pin = parseInt(document.getElementById("pinSelect").value);
            log(`Reading value from Pin ${pin}...`);
            callTool("read_gpio", { pin: pin }, (res) => {
                if (res.result && res.result.content) {
                    try {
                        const parsed = JSON.parse(res.result.content[0].text);
                        if (parsed.level !== undefined) {
                            log(`Pin ${pin} input level: ${parsed.level}`, "success");
                        } else {
                            log(`Failed to read Pin ${pin}: ${parsed.error}`, "error");
                        }
                    } catch (e) {
                        log("Error reading response content.", "error");
                    }
                }
            });
        }

        connectMQTT();
    </script>
</body>
</html>
